<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DUUR 左1st 制御アシスト 試作版 v0.2.18</title>
<style>
:root {
  --bg:#140913; --panel:#211020; --line:#ff28d7; --line2:#8dfcff; --text:#f7eaff; --muted:#bfa9c4;
  --hot:#ffd84a; --ok:#70ffb1; --shadow:0 12px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:radial-gradient(circle at 20% 0%,rgba(255,40,215,.22),transparent 32%),radial-gradient(circle at 90% 20%,rgba(141,252,255,.14),transparent 30%),var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
.app{width:min(980px,100%);margin:0 auto;padding:14px 12px 34px}
.header{border:2px solid var(--line);border-radius:18px;padding:14px;background:rgba(20,9,19,.72);box-shadow:0 0 22px rgba(255,40,215,.22);position:sticky;top:0;z-index:20;backdrop-filter:blur(10px)}
.header h1{margin:0;font-size:20px;line-height:1.2}.header p{margin:8px 0 0;font-size:12px;color:var(--muted)}
.grid{display:grid;gap:12px;margin-top:12px}@media(min-width:760px){.grid{grid-template-columns:360px 1fr;align-items:start}}
.card,.resultCard{background:linear-gradient(180deg,rgba(44,20,43,.96),rgba(24,12,23,.96));border:1px solid rgba(255,40,215,.35);border-radius:18px;box-shadow:var(--shadow);padding:12px}
h2,h3{margin:0 0 10px;font-size:15px;color:#fff}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
button,select{width:100%;border:1px solid rgba(255,255,255,.16);border-radius:12px;padding:11px 10px;background:#10070f;color:var(--text);font-size:15px}
button{cursor:pointer;font-weight:900;background:linear-gradient(135deg,rgba(255,40,215,.72),rgba(117,39,255,.55));border-color:rgba(255,40,215,.8);touch-action:manipulation;transition:transform .08s ease,filter .08s ease,box-shadow .08s ease}
button:active{transform:scale(.96);filter:brightness(1.25);box-shadow:0 0 16px rgba(255,40,215,.5)}
button.secondary{background:#120812;border-color:rgba(141,252,255,.35);color:#d9fbff}
button.limitStop{opacity:.38;filter:saturate(.45);box-shadow:none;}
button.tab{background:#160a15;color:var(--muted);font-size:13px}button.tab.active{color:#fff;background:linear-gradient(135deg,rgba(255,40,215,.45),rgba(141,252,255,.14));box-shadow:0 0 16px rgba(255,40,215,.2)}
.form{display:grid;gap:10px;margin-top:12px}label{display:grid;gap:5px;font-size:12px;color:var(--muted);font-weight:700}.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.modePanel{display:none}.modePanel.active{display:block}
.dualReelCompare{display:grid;grid-template-columns:1fr 28px 1fr;gap:8px;align-items:center;margin-top:10px}
.compareArrow{text-align:center;color:var(--line2);font-size:24px;font-weight:1000}
.miniReelPanel{display:grid;gap:6px}.miniReelTitle{text-align:center;font-size:12px;color:var(--muted);font-weight:900}
.miniReelControls{display:grid;grid-template-columns:1fr 1fr;gap:6px}.miniReelControls button{padding:8px 4px;font-size:13px}
.miniReelWindow{height:174px;overflow:hidden;border:2px solid rgba(255,40,215,.74);border-radius:14px;background:#dce7ed;position:relative;box-shadow:inset 0 0 0 2px rgba(0,0,0,.12)}
.miniReelWindow::after{content:"";position:absolute;left:0;right:0;bottom:0;height:58px;border-top:2px solid rgba(255,40,215,.95);background:linear-gradient(90deg,rgba(255,40,215,.12),rgba(141,252,255,.08));pointer-events:none}
.miniReelRow{height:58px;display:flex;align-items:center;justify-content:center;border-bottom:1px solid rgba(0,0,0,.12);color:#111}
.symbol{height:auto;display:flex;align-items:center;justify-content:center;color:#111;font-weight:1000;user-select:none}
.badge{width:56px;min-height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;text-align:center;padding:4px;border:2px solid rgba(0,0,0,.2);box-shadow:0 3px 0 rgba(0,0,0,.22);font-size:13px;line-height:1;transform:scale(.82)}
.sym-watermelon .badge{background:#69e37c;color:#052d10}.sym-cherry .badge{background:#ff497d;color:#fff}.sym-star .badge{background:#ffdf37;color:#412b00;font-size:22px;clip-path:polygon(50% 0%,61% 30%,95% 31%,68% 51%,79% 84%,50% 64%,21% 84%,32% 51%,5% 31%,39% 30%);width:62px;height:62px;border:0;box-shadow:none}
.sym-red7 .badge{background:#e81830;color:#fff;font-size:24px;transform:scale(.82) skew(-8deg)}.sym-replay .badge{background:#47c9ff;color:#00324a;border-radius:50%;width:58px;height:44px}.sym-white7 .badge{background:#fff;color:#1b9dff;border-color:#93dfff}.sym-blackbar .badge{background:#050505;color:#33f0ff;border-color:#0cf}
.stopHint{text-align:center;font-size:12px;color:var(--line2);font-weight:900;min-height:16px}
.small{font-size:11px;color:var(--muted);line-height:1.55}.result{display:grid;gap:10px}.pills{display:flex;flex-wrap:wrap;gap:6px}.pill{display:inline-flex;align-items:center;gap:4px;padding:6px 8px;border-radius:999px;background:#281326;border:1px solid rgba(255,255,255,.12);font-size:12px;font-weight:800}.pill.hot{border-color:rgba(255,216,74,.75);color:#ffe987;background:rgba(255,216,74,.12)}.pill.ok{border-color:rgba(112,255,177,.7);color:#b8ffd6;background:rgba(112,255,177,.1)}
.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{border-bottom:1px solid rgba(255,255,255,.08);padding:7px 6px;text-align:left;vertical-align:top}.table th{color:#d5faff;background:rgba(141,252,255,.08)}
.notice{border-left:4px solid var(--hot);background:rgba(255,216,74,.09);color:#ffeeb0;padding:10px;border-radius:12px;font-size:12px;line-height:1.55}.hidden{display:none!important}
.footerNote{margin-top:12px;font-size:11px;color:var(--muted);line-height:1.55}
@media(max-width:380px){.dualReelCompare{grid-template-columns:1fr 20px 1fr;gap:5px}.badge{transform:scale(.74)}.sym-red7 .badge{transform:scale(.74) skew(-8deg)}}
.miniReelRow{{height:58px;display:flex;align-items:center;justify-content:center;border-bottom:1px solid rgba(0,0,0,.12);color:#111}}
to{{opacity:1;transform:translateY(0)}}}}

/* v0.2.10 smooth independent reel animation */
.miniReelWindow {
  contain: content;
}
.miniReelRow {
  overflow:hidden;
}
.reelSlideWrap {
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  opacity:1;
  transform:translateY(0) scale(1);
  will-change:transform,opacity;
}
.reelSlideWrap.inUp { animation: reelWindowInUp .22s cubic-bezier(.22,.61,.36,1); }
.reelSlideWrap.inDown { animation: reelWindowInDown .22s cubic-bezier(.22,.61,.36,1); }
@keyframes reelWindowInUp {
  0% { opacity:.18; transform:translateY(24px); }
  100% { opacity:1; transform:translateY(0); }
}
@keyframes reelWindowInDown {
  0% { opacity:.18; transform:translateY(-24px); }
  100% { opacity:1; transform:translateY(0); }
}
.stopHint {
  transition:opacity .16s ease, transform .2s cubic-bezier(.16,.84,.24,1);
}
.stopHint.pulse {
  animation: hintPulse .18s ease-out;
}
@keyframes hintPulse {
  0% { opacity:.25; transform:translateY(6px); }
  100% { opacity:1; transform:translateY(0); }
}


/* v0.2.15 inline SVG symbols */
.symbolSvg {
  width:62px;
  height:50px;
  display:block;
  overflow:visible;
  filter: drop-shadow(0 2px 0 rgba(0,0,0,.18));
}
.symbolSvg text {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-weight: 1000;
  paint-order: stroke;
  stroke-linejoin: round;
}
.symbolSvg .shine {
  opacity:.55;
}

</style>
</head>
<body>
<div class="app">
<header class="header">
<h1>DUUR 左1st 制御アシスト 試作版 v0.2.18</h1>
<p>左1st制御表から「押し位置＋停止位置」ベースで対応役を逆引きします。v0.2.18は赤7・白7を文字ベースの見やすい7図柄へ修正しています。</p>
</header>
<main class="grid">
<section class="card">
<h2>入力</h2>
<div class="tabs">
<button class="tab active" id="tabExact" type="button">押し位置＋停止位置</button>
<button class="tab" id="tabStop" type="button">停止位置から推定</button>
</div>

<div class="dualReelCompare">
  <div class="miniReelPanel">
    <div class="miniReelTitle">押した位置</div>
    <div class="miniReelControls">
      <button class="secondary" id="pressUp" type="button">▲</button>
      <button class="secondary" id="pressDown" type="button">▼</button>
    </div>
    <div class="miniReelWindow" id="pressReelWindow">
      <div class="miniReelRow" id="pressUpper"></div>
      <div class="miniReelRow" id="pressMiddle"></div>
      <div class="miniReelRow" id="pressLower"></div>
    </div>
    <div class="stopHint" id="pressHint">14 スイカ</div>
  </div>
  <div class="compareArrow">→</div>
  <div class="miniReelPanel">
    <div class="miniReelTitle">実際に止まった位置</div>
    <div class="miniReelControls">
      <button class="secondary" id="stopUp" type="button">▲</button>
      <button class="secondary" id="stopDown" type="button">▼</button>
    </div>
    <div class="miniReelWindow" id="stopReelWindow">
      <div class="miniReelRow" id="stopUpper"></div>
      <div class="miniReelRow" id="stopMiddle"></div>
      <div class="miniReelRow" id="stopLower"></div>
    </div>
    <div class="stopHint" id="stopHint">ビタ停止</div>
  </div>
</div>

<div id="modeExact" class="modePanel active">
  <div class="form">
    <label>押した番号<select id="pressSelect"></select></label>
    <label>自動算出スベリ
      <select id="slipSelect" class="hidden" aria-hidden="true">
        <option value="0">0コマ / ビタ</option><option value="1">1コマ</option><option value="2">2コマ</option><option value="3">3コマ</option><option value="4">4コマ</option>
      </select>
      <div class="notice" id="autoSlipNotice">右の停止位置リールで0〜4コマ滑りを選択します。左リール変更時は右も自動追従します。</div>
    </label>
  </div>
</div>

<div id="modeStop" class="modePanel">
  <div class="form">
    <div class="row2">
      <label>止まった図柄<select id="stopSymbolSelect"></select></label>
      <label>停止ライン<select id="stopLineSelect"><option value="upper">上段</option><option value="middle" selected>中段</option><option value="lower">下段</option></select></label>
    </div>
    <label>ざっくり押した範囲<select id="roughAreaSelect"><option value="all">不明 / 全範囲</option><option value="red7">赤7付近</option><option value="blackbar">黒BAR付近</option><option value="white7">白7付近</option><option value="watermelon">スイカ付近</option><option value="cherry">チェリー付近</option></select></label>
  </div>
</div>

<div class="form">
<label>演出・対応役メモ<select id="effectSelect"></select></label>
<button id="analyzeBtn" type="button">解析</button>
</div>
<p class="footerNote">※左は押した位置、右は実際に止まった位置です。右リールは0〜4コマの範囲内だけ動き、図柄はインラインSVGで表示します。</p>
</section>
<section class="result" id="resultArea"><div class="resultCard"><h3>結果</h3><p class="small">入力後に解析結果を表示します。</p></div></section>
</main>
</div>

    <text x="50" y="42" font-size="18" text-anchor="middle" fill="#16d9ff" stroke="#00151f" stroke-width="2.5">BAR</text>
  </svg>`;
}

function svgWhite7(){
  return `
  <svg class="symbolSvg" viewBox="0 0 100 74" aria-label="白7">
    <defs>
      <linearGradient id="w7G3" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#ffffff"/>
        <stop offset=".48" stop-color="#f2ffff"/>
        <stop offset="1" stop-color="#b7f4ff"/>
      </linearGradient>
    </defs>
    <g transform="skewX(-9)">
      <text x="50" y="61"
        font-size="66"
        text-anchor="middle"
        fill="url(#w7G3)"
        stroke="#4bcfff"
        stroke-width="7"
        stroke-linejoin="round">7</text>
      <text x="50" y="61"
        font-size="66"
        text-anchor="middle"
        fill="url(#w7G3)"
        stroke="#ffffff"
        stroke-width="1.8"
        stroke-linejoin="round">7</text>
      <path d="M29 20 H70" stroke="#ffffff" stroke-width="3" opacity=".85"/>
      <text x="61" y="54" font-size="10" fill="#1aa7ff" stroke="#ffffff" stroke-width="1.2">ULTRA</text>
    </g>
  </svg>`;
}

function svgSymbol(sym){
  if (sym === "リプレイ") return svgReplay();
  if (sym === "星") return svgStar();
  if (sym === "スイカ") return svgWatermelon();
  if (sym === "チェリー") return svgCherry();
  if (sym === "赤7") return svgRed7();
  if (sym === "黒BAR") return svgBlackBar();
  if (sym === "白7") return svgWhite7();
  return `<svg class="symbolSvg" viewBox="0 0 100 74"><text x="50" y="44" font-size="18" text-anchor="middle" fill="#111">${displaySymbol(sym)}</text></svg>`;
}

function symbolBadgeHTML(num, dir="none"){
  const sym = REEL[num];
  const cls = dir === "up" ? "inUp" : (dir === "down" ? "inDown" : "");
  return `<div class="reelSlideWrap ${cls}"><div class="symbol ${cssClassFor(sym)}">${svgSymbol(sym)}</div></div>`;
}function renderThreeReel(prefix, lowerNum, dir="none"){
  const rows = {
    Upper: mod20(lowerNum + 2),
    Middle: mod20(lowerNum + 1),
    Lower: mod20(lowerNum)
  };
  for (const [pos, num] of Object.entries(rows)) {
    document.getElementById(prefix + pos).innerHTML = symbolBadgeHTML(num, dir);
  }
}

function getStopLower(){
  return mod20(selectedPress + currentSlip);
}

function pulseText(el){
  if (!el) return;
  el.classList.remove("pulse");
  void el.offsetWidth;
  el.classList.add("pulse");
}

function updateHints(pressChanged=true, stopChanged=true){
  const stopLower = getStopLower();
  const pressHint = document.getElementById("pressHint");
  const stopHint = document.getElementById("stopHint");

  const pressText = `${selectedPress} ${REEL[selectedPress]}`;
  const stopText = currentSlip === 0 ? "ビタ停止" : `${currentSlip}コマ滑り`;

  if (pressHint.textContent !== pressText) {
    pressHint.textContent = pressText;
    if (pressChanged) pulseText(pressHint);
  }
  if (stopHint.textContent !== stopText) {
    stopHint.textContent = stopText;
    if (stopChanged) pulseText(stopHint);
  }

  document.getElementById("pressSelect").value = String(selectedPress);
  document.getElementById("slipSelect").value = String(currentSlip);
}

function updateDualReels(pressDir="none", stopDir="none"){
  renderThreeReel("press", selectedPress, pressDir);
  renderThreeReel("stop", getStopLower(), stopDir);
  updateHints(pressDir !== "none", stopDir !== "none");
  updateStopButtons();
}

function setSelectedPress(num, dir="none"){
  selectedPress = mod20(Number(num));
  updateDualReels(dir, dir === "none" ? "none" : dir);
  if (mode === "exact") analyze();
}

function updateStopButtons(){
  const up = document.getElementById("stopUp");
  const down = document.getElementById("stopDown");
  if (!up || !down) return;

  // ▲はスベリ -1、▼はスベリ +1。
  // 0と4の端では見た目だけ弱くし、クリックしても移動しない。
  up.classList.toggle("limitStop", currentSlip <= 0);
  down.classList.toggle("limitStop", currentSlip >= 4);
}

function setSlip(nextSlip, dir="none"){
  const clamped = Math.max(0, Math.min(4, Number(nextSlip)));

  if (clamped === currentSlip) {
    updateStopButtons();
    return;
  }

  currentSlip = clamped;
  updateDualReels("none", dir);
  updateStopButtons();

  if (mode === "exact") analyze();
}

function nudgePress(delta){
  // delta < 0: 図柄を上へ動かす / delta > 0: 図柄を下へ動かす
  // 下段基準番号は、図柄を下へ動かすと +1、上へ動かすと -1 になる。
  const nextPress = mod20(selectedPress + delta);
  setSelectedPress(nextPress, delta > 0 ? "down" : "up");
}

function nudgeStop(delta){
  // 右リールは0〜4コマ滑りの範囲だけを動かす。
  // ▼で図柄を下へ動かす = スベリを+1、▲で図柄を上へ動かす = スベリを-1。
  setSlip(currentSlip + delta, delta > 0 ? "down" : "up");
}

function lineSymbolsFromLower(lower){return {upper:mod20(lower+2),middle:mod20(lower+1),lower:mod20(lower)};}
function roleCategory(role){if(role.includes("ハズレ"))return"hazure";if(role.includes("リプレイ"))return"replay";if(role.includes("3枚役"))return"sanmai";if(role.includes("チェリー"))return"cherry";if(role==="スイカA")return"suikaA";if(role==="スイカB")return"suikaB";if(role.includes("ボーナス濃厚"))return"bonusDense";if(role.includes("リーチ目役"))return"reach";return"other";}
function groupMatcher(group){return function(role){const cat=roleCategory(role);if(group==="hazure")return cat==="hazure";if(group==="replay")return cat==="replay";if(group==="sanmai")return cat==="sanmai";if(group==="cherry")return cat==="cherry";if(group==="suikaA")return cat==="suikaA";if(group==="suikaB")return cat==="suikaB";if(group==="suikaAny")return cat==="suikaA"||cat==="suikaB";if(group==="bonusDense")return cat==="bonusDense"||cat==="reach";if(group==="reach")return cat==="reach";if(group==="rare")return cat==="cherry"||cat==="suikaA"||cat==="suikaB"||cat==="bonusDense"||cat==="reach";if(group==="koyakuPlus")return cat!=="hazure";if(group==="notCherry")return cat!=="cherry";return false;};}
function roleMatchesGroups(role,roleGroups){if(!roleGroups)return false;return roleGroups.split("|").some(g=>groupMatcher(g.trim())(role));}
function unique(arr){return [...new Set(arr)];}
function byRoleSort(a,b){const order=["ハズレ(0枚)","ハズレ(1枚)","リプレイ","3枚役","ボーナス濃厚3枚役","チェリー","ボーナス濃厚チェリー","スイカA","スイカB"];const ia=order.indexOf(a),ib=order.indexOf(b);return(ia===-1?99:ia)-(ib===-1?99:ib)||a.localeCompare(b,"ja");}
function exactAnalyze(){
  const press = selectedPress;
  const slip = currentSlip;
  const stop = getStopLower();
  const rows = CONTROL_DATA.filter(r => r.press === press && r.slip === slip);
  const roles = unique(rows.map(r => r.role)).sort(byRoleSort);
  return {type:"exact", press, slip, stop, rows, roles, line:lineSymbolsFromLower(stop)};
}

function roughPressSet(area){const all=ORDER_TOP_TO_BOTTOM;const around=(center,radius=2)=>{const res=[];for(let d=-radius;d<=radius;d++)res.push(mod20(center+d));return res;};if(area==="all")return new Set(all);if(area==="red7")return new Set(around(16,3));if(area==="blackbar")return new Set(around(3,3));if(area==="white7")return new Set(around(10,3));if(area==="watermelon")return new Set([20,17,14,9,2,19,18,16,15,13,10,8,3,1]);if(area==="cherry")return new Set([...around(19,2),...around(6,2)]);return new Set(all);}
function stopAnalyze(){const sym=document.getElementById("stopSymbolSelect").value;const line=document.getElementById("stopLineSelect").value;const rough=document.getElementById("roughAreaSelect").value;const pressAllowed=roughPressSet(rough);const lowerStops=[];for(const [numStr,s]of Object.entries(REEL)){const num=Number(numStr);if(s!==sym)continue;let lower;if(line==="lower")lower=num;if(line==="middle")lower=mod20(num-1);if(line==="upper")lower=mod20(num-2);lowerStops.push(lower);}const candidates=[];for(const lower of lowerStops){for(let slip=0;slip<=4;slip++){const press=mod20(lower-slip);if(!pressAllowed.has(press))continue;const rows=CONTROL_DATA.filter(r=>r.press===press&&r.slip===slip&&r.stop===lower);if(rows.length)candidates.push({lower,press,slip,rows,roles:unique(rows.map(r=>r.role)).sort(byRoleSort)});}}const roles=unique(candidates.flatMap(c=>c.roles)).sort(byRoleSort);return {type:"stop",symbol:sym,visibleLine:line,rough,lowerStops:unique(lowerStops),candidates,roles};}
function getEffectRule(effect){return EFFECT_DATA.find(e=>e.id===effect)||null;}
function effectJudge(roles){const effect=document.getElementById("effectSelect").value;const rule=getEffectRule(effect);if(!rule)return{label:"演出未選択",detail:"演出照合は行っていません。"};const matched=roles.filter(r=>roleMatchesGroups(r,rule.roleGroups));const roleList=roles.length?roles.join(" / "):"該当候補なし";const ruleText=rule.exactRoles||rule.roleGroups||"条件未設定";if(!rule.roleGroups)return{label:"演出メモ",detail:`${rule.label}：${rule.hotText||ruleText}<br><span class="small">現在の候補：${roleList}</span>`};if(matched.length===0)return{label:"矛盾候補 / 激アツ寄り",detail:`${rule.label}<br>対応目安：${ruleText}<br>${rule.hotText||"候補役と演出対応役が一致していません。"}<br><span class="small">現在の候補：${roleList}</span>`};return{label:"対応役あり",detail:`${rule.label}<br>対応目安：${ruleText}<br>一致候補：${matched.join(" / ")}<br><span class="small">${rule.hotText||""}</span>`};}
function renderRoles(roles){if(!roles.length)return`<p class="small">該当役なし。入力条件が厳しすぎる可能性があります。</p>`;return`<div class="pills">${roles.map(r=>{const cat=roleCategory(r);const cls=cat==="reach"||cat==="bonusDense"?"hot":(cat==="suikaA"||cat==="suikaB"||cat==="cherry"?"ok":"");return`<span class="pill ${cls}">${r}</span>`;}).join("")}</div>`;}
function renderLine(line){return`<table class="table"><tr><th>ライン</th><th>番号</th><th>図柄</th></tr><tr><td>上段</td><td>${line.upper}</td><td>${REEL[line.upper]}</td></tr><tr><td>中段</td><td>${line.middle}</td><td>${REEL[line.middle]}</td></tr><tr><td>下段</td><td>${line.lower}</td><td>${REEL[line.lower]}</td></tr></table>`;}
function formatMove(press,stop,slip){return slip===0?`${press} ${REEL[press]} → ${stop} ${REEL[stop]}`:`${press} ${REEL[press]} → ${slip}コマ滑り → ${stop} ${REEL[stop]}`;}
function renderResult(res){let html="";if(res.type==="exact"){html+=`<div class="resultCard"><h3>停止計算</h3><div class="pills"><span class="pill hot">${formatMove(res.press,res.stop,res.slip)}</span><span class="pill">スベリ：${res.slip}コマ</span></div></div><div class="resultCard"><h3>停止形</h3>${renderLine(res.line)}</div>`;}else{const lineText={upper:"上段",middle:"中段",lower:"下段"}[res.visibleLine];html+=`<div class="resultCard"><h3>停止位置から推定</h3><div class="pills"><span class="pill">${res.symbol} ${lineText}停止</span><span class="pill">推定下段停止番号：${res.lowerStops.join(" / ")}</span><span class="pill">候補：${res.candidates.length}パターン</span></div></div>`;if(res.candidates.length)html+=`<div class="resultCard"><h3>候補押し位置</h3><table class="table"><tr><th>推定移動</th><th>下段停止</th><th>推定押し</th><th>スベリ</th><th>該当役</th></tr>${res.candidates.map(c=>`<tr><td>${formatMove(c.press,c.lower,c.slip)}</td><td>${c.lower} / ${REEL[c.lower]}</td><td>${c.press} / ${REEL[c.press]}</td><td>${c.slip}コマ</td><td>${c.roles.join(" / ")}</td></tr>`).join("")}</table></div>`;}const judge=effectJudge(res.roles);html+=`<div class="resultCard"><h3>出てくる可能性がある役</h3>${renderRoles(res.roles)}</div><div class="resultCard"><h3>演出照合</h3><div class="notice"><strong>${judge.label}</strong><br>${judge.detail}</div></div><div class="resultCard"><h3>判定メモ</h3><p class="small">左1st停止制御表と演出整理データを使用。2nd/3rd停止、リーチ目ミッション派生は未登録です。</p></div>`;document.getElementById("resultArea").innerHTML=html;}
function analyze(){const res=mode==="exact"?exactAnalyze():stopAnalyze();renderResult(res);}
function switchMode(next){mode=next;document.getElementById("tabExact").classList.toggle("active",mode==="exact");document.getElementById("tabStop").classList.toggle("active",mode==="stop");document.getElementById("modeExact").classList.toggle("active",mode==="exact");document.getElementById("modeStop").classList.toggle("active",mode==="stop");analyze();}
function setupSelects(){const press=document.getElementById("pressSelect");press.innerHTML="";ORDER_TOP_TO_BOTTOM.forEach(num=>{const opt=document.createElement("option");opt.value=num;opt.textContent=`${num}：${REEL[num]}`;press.appendChild(opt);});press.addEventListener("change",e=>setSelectedPress(Number(e.target.value)));const stopSym=document.getElementById("stopSymbolSelect");["赤7","黒BAR","白7","スイカ","チェリー","星","リプレイ"].forEach(sym=>{const opt=document.createElement("option");opt.value=sym;opt.textContent=sym;stopSym.appendChild(opt);});stopSym.value="赤7";const eff=document.getElementById("effectSelect");eff.innerHTML=`<option value="none">未選択</option>`;const modes=["共通","REMIX","DISC UP","CLASSIC"];modes.forEach(m=>{const list=EFFECT_DATA.filter(e=>e.mode===m);if(!list.length)return;const og=document.createElement("optgroup");og.label=m;list.forEach(e=>{const opt=document.createElement("option");opt.value=e.id;opt.textContent=e.label;og.appendChild(opt);});eff.appendChild(og);});}
function bindGestures(stage,handler){if(!stage)return;stage.addEventListener("wheel",e=>{e.preventDefault();handler(e.deltaY>0?1:-1);},{passive:false});let startY=null;stage.addEventListener("touchstart",e=>{startY=e.touches[0].clientY;},{passive:true});stage.addEventListener("touchend",e=>{if(startY===null)return;const diff=e.changedTouches[0].clientY-startY;if(Math.abs(diff)>20)handler(diff>0?1:-1);startY=null;},{passive:true});}
function init(){setupSelects();currentSlip=0;updateDualReels();updateStopButtons();document.getElementById("pressUp").addEventListener("click",()=>nudgePress(-1));document.getElementById("pressDown").addEventListener("click",()=>nudgePress(1));document.getElementById("stopUp").addEventListener("click",()=>nudgeStop(-1));document.getElementById("stopDown").addEventListener("click",()=>nudgeStop(1));document.getElementById("tabExact").addEventListener("click",()=>switchMode("exact"));document.getElementById("tabStop").addEventListener("click",()=>switchMode("stop"));document.getElementById("analyzeBtn").addEventListener("click",analyze);["stopSymbolSelect","stopLineSelect","roughAreaSelect","effectSelect"].forEach(id=>document.getElementById(id).addEventListener("change",analyze));bindGestures(document.getElementById("pressReelWindow"),nudgePress);bindGestures(document.getElementById("stopReelWindow"),nudgeStop);analyze();}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",init);else init();
</script>
</body>
